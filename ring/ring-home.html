<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holorun</title>
<link rel="stylesheet" href="ring.css">
</head>
<body>

  <main class="ring-hero">
    <div class="ring-stage">

      <!-- decorative floating icons -->
      <svg class="deco deco-target" viewBox="0 0 40 40" aria-hidden="true">
        <circle class="dash-ring" cx="20" cy="20" r="10"/>
        <circle cx="20" cy="20" r="3" fill="currentColor"/>
      </svg>

      <svg class="deco deco-nodes" viewBox="0 0 40 40" aria-hidden="true">
        <line x1="10" y1="28" x2="22" y2="10" stroke="currentColor" stroke-width="1.4"/>
        <line x1="22" y1="10" x2="32" y2="18" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="10" cy="28" r="3" fill="currentColor"/>
        <circle cx="22" cy="10" r="3" fill="currentColor"/>
        <circle cx="32" cy="18" r="3" fill="currentColor"/>
      </svg>

      <svg class="deco deco-dots" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="4"  r="1.6" fill="currentColor"/>
        <circle cx="32" cy="10" r="1.6" fill="currentColor"/>
        <circle cx="36" cy="20" r="1.6" fill="currentColor"/>
        <circle cx="32" cy="30" r="1.6" fill="currentColor"/>
        <circle cx="20" cy="36" r="1.6" fill="currentColor"/>
        <circle cx="8"  cy="30" r="1.6" fill="currentColor"/>
        <circle cx="4"  cy="20" r="1.6" fill="currentColor"/>
        <circle cx="8"  cy="10" r="1.6" fill="currentColor"/>
      </svg>

      <svg class="deco deco-cube" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 6 L32 13 L32 27 L20 34 L8 27 L8 13 Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M20 6 L20 20 L32 27 M20 20 L8 27" fill="none" stroke="currentColor" stroke-width="1.4"/>
      </svg>

      <svg class="deco deco-eye" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M4 20 C 10 10, 30 10, 36 20 C 30 30, 10 30, 4 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="20" cy="20" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      </svg>

      <!-- the ring, split into 3 independently-tilting layers stacked on top
           of each other — each gets its own continuous 3D drift via CSS -->

      <!-- layer 1: white rim + glow halo -->
      <svg class="ring-svg ring-layer ring-layer--rim" viewBox="0 0 800 800" aria-hidden="true">
        <defs>
          <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- rotated 18deg so the stroke-dasharray reveal's start/end seam
             lands in the gap between Features and Vision instead of right
             under the Features label -->
        <circle class="ring-glow" cx="400" cy="400" r="206" filter="url(#ringGlow)" transform="rotate(18 400 400)"/>
        <circle class="ring-rim" cx="400" cy="400" r="206" transform="rotate(18 400 400)"/>
      </svg>

      <!-- layer 2: mid gray gasket + dark connector gears -->
      <svg class="ring-svg ring-layer ring-layer--bezel" viewBox="0 0 800 800" aria-hidden="true">
        <!-- same rotation, same reason -->
        <circle class="ring-gasket" cx="400" cy="400" r="229" transform="rotate(18 400 400)"/>
        <g class="ring-spokes"></g>
      </svg>

      <!-- layer 3: light nav segments + labels -->
      <svg class="ring-svg ring-layer ring-layer--segments" viewBox="0 0 800 800" role="img" aria-label="Holorun navigation ring">
        <defs></defs>
        <g class="ring-segments"></g>
        <g class="ring-labels"></g>
      </svg>

      <!-- funnel panel: sits inside the ring's center void. Static for now,
           step 1 of the funnel feature — hourglass shape (wide top/bottom,
           pinched waist through the middle rows) + sub-nav rows, no
           content/interaction yet -->
      <div class="funnel">
        <div class="funnel-bg"></div>
        <div class="funnel-shape">
          <div class="section row-holorun">Holorun</div>
          <div class="section row-brief">Brief</div>
          <div class="section row-beginning">Beginning</div>
          <div class="section row-whbc">What Has Been Changing</div>
          <div class="section row-platform">The Platform</div>
          <div class="section row-inside">Inside</div>
        </div>
        <svg class="funnel-outline" viewBox="0 0 43 32" preserveAspectRatio="none" aria-hidden="true">
          <!-- outer outline: computed intersections — Y gap 1.5, waist X gap 0.8 -->
          <polygon class="funnel-row-stroke" points="5.9,-1.5 37.1,-1.5 28.32,11.2 28.32,20.8 37.1,33.5 5.9,33.5 14.68,20.8 14.68,11.2"/>
        </svg>
      </div>

    </div>

    <svg class="deco deco-hint" viewBox="0 0 40 40" aria-hidden="true">
      <circle class="dash-ring" cx="20" cy="20" r="10"/>
      <circle cx="20" cy="20" r="3" fill="currentColor"/>
    </svg>
  </main>

  <script src="ring.js"></script>
  <script>
    setTimeout(function() {
      document.querySelector('.funnel').classList.add('funnel--open');
    }, 500);

  </script>
</body>
</html>
